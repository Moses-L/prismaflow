[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismaflow"
version = "0.1.0"
description = "Create PRISMA 2020 systematic review flow diagrams in Python (PNG, SVG, PDF and interactive HTML)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Moses Luke" }]
keywords = ["PRISMA", "PRISMA 2020", "systematic review", "meta-analysis", "flow diagram", "evidence synthesis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["graphviz>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
prismaflow = "prismaflow.cli:main"

[project.urls]
Homepage = "https://github.com/Moses-L/prismaflow"
Issues = "https://github.com/Moses-L/prismaflow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
